# Test every push and pull request; deploy main to Fly.io when the tests pass.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The Python tests use fakes for the models, so CPU-only PyTorch is plenty.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements-dev.txt
      - run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - working-directory: extension
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      # Until the FLY_API_TOKEN secret is added (see README "Deploying"), skip instead of failing.
      - if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN isn't set, so this push wasn't deployed. See README 'Deploying'."
      - if: env.FLY_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      # Fly builds the Docker image on its own builders.
      - if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
