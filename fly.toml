# Fly.io deployment. See README "Deploying" for the one-time setup.
# App names are global on Fly: if "signmeup" is taken, pick another and change it here.
app = "signmeup"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SIGNMEUP_WHISPER_MODEL = "tiny"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine always runs, so visitors never wait for it to start and load the models
  # (about 40 s from a stop). Set min_machines_running = 0 to scale to zero instead: no cost
  # while stopped, but the first visit after an idle spell is slow.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Sign animations and Signbank lookups are cached here, so they survive restarts.
[[mounts]]
  source = "signmeup_data"
  destination = "/data"

# Whisper, Stanza (PyTorch) and MediaPipe together need a few GB of memory.
[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
